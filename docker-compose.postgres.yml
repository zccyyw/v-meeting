# PostgreSQL overlay（新版默认入口已自动处理 DB_DRIVER，此文件可选，仅用于旧式 -f 显式调用）。
# 新版推荐：直接 docker compose up -d，由 .env 的 COMPOSE_PROFILES=postgres 控制。
#
# 旧式用法（仍兼容）：
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml \
#     --profile postgres --env-file .env up -d --build
#
# Ensure .env has:
#   COMPOSE_PROFILES=postgres
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB

services:
  api:
    environment:
      DB_DRIVER: postgres

  realtime:
    environment:
      DB_DRIVER: postgres
