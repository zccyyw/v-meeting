# Meeting 生产编排（统一入口）
#
# 用法：
#   docker-compose up -d            # 离线镜像部署
#   docker-compose up -d --build    # 在线构建部署
#
# 数据库由 .env 里的 COMPOSE_PROFILES 控制：
#   sqlite（默认，零依赖） / mysql / postgres
#
# 注意：本文件使用 profiles 与 depends_on.required:false，需要 **Docker Compose v2.20+**。
# 麒麟 V10 SP1 等自带旧版 Docker 的环境，请使用离线包内附带的 docker-compose v2 二进制，
# 或改用 RPM / DEB 包部署。详见 docs/install/。

# 统一日志轮转：docker 自带 json-file 日志同样封顶（50MB×3），
# 防止 /var/lib/docker 被撑爆；宿主机文件日志见各服务 ./logs/* 挂载与
# install.sh 生成的 logrotate 配置（logs/ 目录按天轮转、默认保留 15 天）。
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  # 数据库/缓存容器仅通过内部网络访问（不向宿主机发布端口）。
  # 需要宿主机直连调试时再显式取消注释对应 ports。
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meeting}
      MYSQL_USER: ${MYSQL_USER:-meeting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meetingpass}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    # 错误日志落盘到挂载目录（宿主机 logs/mysql/error.log）；目录属主由
    # install.sh chown 999:999（容器内 mysqld 以 mysql 用户写）
    command: ["--character-set-server=utf8mb4", "--log-error=/var/log/mysql/error.log"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='${MYSQL_ROOT_PASSWORD:-rootpass}' mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    # 12 已 EOL（2024-11）升级 16；dev 从未初始化 pg 卷，直接换 tag 无数据迁移
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      POSTGRES_DB: ${POSTGRES_DB:-meeting}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    # 日志收集器落盘到挂载目录（单文件追加，宿主机 logrotate copytruncate 滚动）；
    # 目录属主由 install.sh chown 70:70（alpine 镜像 postgres 用户）
    command:
      [
        "-c", "logging_collector=on",
        "-c", "log_directory=/var/log/postgresql",
        "-c", "log_filename=postgresql.log",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeting} -d ${POSTGRES_DB:-meeting}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis 存放登录会话等敏感数据：必须设密码、不对外发布端口。
  redis:
    # 钉 minor：本 dev 实际运行 7.4.11；Redis 8 许可证有变暂不跟
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    # REDIS_PASSWORD 留空 = 不启用认证（不能传空的 --requirepass，redis-server 会异常）；
    # 非空时作为 requirepass，需与 api 侧 REDIS_PASSWORD 保持一致。
    # 日志落盘到挂载目录（install.sh chown 999:999，容器内以 redis 用户写）
    command:
      [
        "sh",
        "-c",
        "exec redis-server ${REDIS_PASSWORD:+--requirepass \"$REDIS_PASSWORD\"} --logfile /var/log/redis/redis.log",
      ]
    volumes:
      - redis-data:/data
      - ./logs/redis:/var/log/redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: serve/api/Dockerfile
    image: ${MEETING_API_IMAGE:-meeting-api:latest}
    restart: unless-stopped
    logging: *default-logging
    # 优雅停机：给 API 30s 完成进行中的请求（含录制上传）后再 SIGKILL
    stop_grace_period: 30s
    environment:
      # 数据库驱动跟随 .env 的 DB_DRIVER（本地默认 mysql，与宿主机 db:reset 同库）
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      # 容器内经 host.docker.internal 访问宿主机 MySQL（开发场景，需
      # extra_hosts 的 host-gateway 解析，见下方）；离线包默认连包内
      # mysql 容器（服务名 mysql），开箱即用
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-meeting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meetingpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meeting}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-meeting}
      PGPASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      PGDATABASE: ${POSTGRES_DB:-meeting}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 留空 = 不使用密码（需与 redis 容器的认证配置一致）。
      # 注意用 ${VAR-default} 而非 ${VAR:-default}：空字符串要保留为空，
      # 才能真正做到"显式清空 = 无密码"
      REDIS_PASSWORD: ${REDIS_PASSWORD-meetingpass}
      # Redis 库序号（默认 0）
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      # 密码传输加密密钥：与 web 容器（entrypoint 注入前端 window.__MEETING_CRYPTO_KEY__）
      # 必须同源一致；缺失/占位值时 api 因 crypto-guard 拒绝启动
      MEETING_CRYPTO_KEY: ${MEETING_CRYPTO_KEY:-}
      API_PORT: 8080
      RECORDINGS_DIR: ${RECORDINGS_DIR:-/app/data/recordings}
      # 证书目录：用于登录页提供 CA 根证书下载（/api/certs/ca.crt）
      CERT_DIR: /certs
    extra_hosts:
      # 宿主机数据库场景（.env 显式配 MYSQL_HOST=host.docker.internal）在
      # Linux 引擎上的解析支持；默认连包内 mysql 容器（服务名）
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      # 3s：进程 1-3s 内就绪，缩短 depends_on(service_healthy) 的等待感知
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "8080"
    volumes:
      - meeting-data:/app/data
      - ./deploy/docker/certs:/certs:ro
      - ./logs/api:/app/logs
    # 日志落盘（stdout+stderr → 宿主机 logs/api/api.log）；exec 保证 node 接管
    # PID 1 以正常接收 SIGTERM 优雅停机（迁移/种子阶段输出一并进文件）
    command:
      [
        "sh",
        "-c",
        "{ node dist/migrate.js && node dist/seed-admin.js && exec node dist/index.js; } >> /app/logs/api.log 2>&1",
      ]

  realtime:
    build:
      context: .
      dockerfile: serve/realtime/Dockerfile
    image: ${MEETING_REALTIME_IMAGE:-meeting-realtime:latest}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      # 数据库驱动跟随 .env 的 DB_DRIVER（本地默认 mysql，与宿主机 db:reset 同库）
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      # 容器内经 host.docker.internal 访问宿主机 MySQL（开发场景，需
      # extra_hosts 的 host-gateway 解析，见下方）；离线包默认连包内
      # mysql 容器（服务名 mysql），开箱即用
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-meeting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meetingpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meeting}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-meeting}
      PGPASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      PGDATABASE: ${POSTGRES_DB:-meeting}
      WS_PORT: 8082
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      # 支持通过 .env 覆盖（与 docker-compose 的 ports 使用同一组变量）
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-41000}
      # 会议自动结束相关开关（毫秒）；0 表示关闭。见 .env.production.example
      MEETING_EMPTY_ROOM_GRACE_MS: ${MEETING_EMPTY_ROOM_GRACE_MS:-180000}
      MEETING_HOST_RECONNECT_GRACE_MS: ${MEETING_HOST_RECONNECT_GRACE_MS:-300000}
      MEETING_STALE_SWEEP_MS: ${MEETING_STALE_SWEEP_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-41000}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-41000}/udp"
    expose:
      - "8082"
    volumes:
      - meeting-data:/app/data
      - ./logs/realtime:/app/logs
    # 日志落盘（stdout+stderr → 宿主机 logs/realtime/realtime.log）；
    # exec 保证 node 接管 PID 1 以正常接收 SIGTERM 优雅停机
    command: ["sh", "-c", "exec node dist/index.js >> /app/logs/realtime.log 2>&1"]

  web:
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-auto}
        VITE_APP_NAME: ${VITE_APP_NAME:-Meeting}
        VITE_APP_LOGO: ${VITE_APP_LOGO:-/favicon.svg}
        # PWA 默认关闭（1 开启）；离线包内镜像已构建完成，改这里需自行重新构建镜像
        VITE_PWA_ENABLED: ${VITE_PWA_ENABLED:-0}
    image: ${MEETING_WEB_IMAGE:-meeting-web:latest}
    restart: unless-stopped
    logging: *default-logging
    # nginx 的 proxy_pass 在启动时解析 upstream 主机名，realtime 未启动会
    # emerg 退出（host not found in upstream "realtime"）。强制先起 realtime。
    depends_on:
      - realtime
    environment:
      # 运行时配置注入：这些键在「安装前」改 .env 即生效（web 容器启动时写入 /app-config.js，
      # 随 up -d 重建 web 容器加载），无需重建镜像；未设置时用镜像内构建期默认
      VITE_APP_NAME: ${VITE_APP_NAME:-}
      MEETING_CRYPTO_KEY: ${MEETING_CRYPTO_KEY:-}
      VITE_API_BASE: ${VITE_API_BASE:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
    volumes:
      # logo 定制：把客户的 favicon.svg / favicon.ico 放进 ./branding/ 后 `up -d` 重建 web 生效
      - ./branding:/branding:ro
      # 访问/错误日志落盘（nginx.conf 显式指定路径，官方镜像的 /dev/stdout 软链被挂载覆盖）
      - ./logs/web:/var/log/nginx
    # CentOS 7 (kernel 3.10) overlayfs pwrite() bug causes nginx PID write to
    # fail with EPERM. Mount /run as tmpfs to bypass the overlay filesystem.
    tmpfs:
      - /run
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
    expose:
      - "80"

  caddy:
    # 钉 minor：浮动 2-alpine 已漂到 2.11.x（本 dev 实际运行 v2.11.7）
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      # 访问日志落盘（Caddyfile log.output file；关闭 caddy 内建滚动，由宿主机 logrotate 统一）
      - ./logs/caddy:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  meeting-data:
  caddy-data:
  caddy-config:
