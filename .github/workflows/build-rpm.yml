# =============================================================================
# GitHub Actions — 统一构建工作流
#
# 支持全部 5 种打包方式，全部在 GitHub Actions 远程 Linux runner 上完成：
#   1. 源码打包（pack）       → dist/ 目录的编译产物
#   2. Docker 离线包（pack:docker）→ .tar 镜像包
#   3. Native 离线包（pack:native）→ .zip 安装包（单层目录，与 zip 同名）
#   4. RPM 包（pack:rpm）     → .rpm 安装包
#   5. DEB 包                 → .deb 安装包
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）：选择打包方式和目标架构
#   2. 推送 tag v* 时自动触发：同时构建 x64+arm64 的全部包
#
# 产物下载：
#   1. Actions → Run details → Artifacts 区下载 ZIP 压缩包（手动触发仅有此方式）。
#   2. tag 推送构建：全部产物同时上传到对应版本的 GitHub Release
#      （Releases 页直接下载，rpm/deb 为原始包可直接安装，多文件交付包为 zip）。
#
# 安装到目标服务器：
#   sudo rpm -ivh meeting-*.rpm        # RPM 系（CentOS/麒麟/UOS）
#   sudo dpkg -i meeting-*.deb         # DEB 系（Ubuntu/Deepin/UOS）
#   unzip meeting-native-*.zip && cd meeting-native-*/ && sudo ./install.sh  # Native 离线包
#   docker load -i meeting-app-*.tar    # Docker 离线包
# =============================================================================
name: Build Packages

on:
  # 手动触发：在 GitHub 仓库 → Actions → Build Packages → Run workflow
  workflow_dispatch:
    inputs:
      build_type:
        description: "打包方式（可多选）"
        type: choice
        options:
          - all
          - pack
          - docker
          - native
          - rpm
          - deb
        default: all
      target_arch:
        description: "目标 CPU 架构"
        type: choice
        options:
          - x64
          - arm64
        default: x64
      version:
        description: "版本号（如 0.1）"
        required: true
        default: "0.1"
      release:
        description: "发布号（如 1）"
        required: true
        default: "1"

  # 推送 tag 时自动触发（同时构建 x64 和 arm64 全部包）
  push:
    tags:
      - "v*"

# 同一分支的并发构建只保留最新的
concurrency:
  group: build-${{ github.ref }}-${{ inputs.target_arch || 'all' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NODE_TAR_VERSION: "v22.23.1"

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 构建矩阵：tag 推送时同时构建 x64+arm64，手动触发只构建选中的架构
  # ───────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_type: ${{ steps.set-params.outputs.build_type }}
      version: ${{ steps.set-params.outputs.version }}
      release: ${{ steps.set-params.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 早失败门禁：systemd 单元必须兼容目标最低版本（systemd 219 / 麒麟 V10 SP1）。
      # 放在 prepare（所有 job 都依赖它）里，失败即整体停止，避免打出"装不上/起不来"的包。
      - name: Lint systemd units (systemd 219 compatible)
        run: bash deploy/native/lint-systemd-units.sh

      # 早失败门禁：三份环境模板必须与 config/env.schema.mjs 完全一致，
      # 防止「模板漂移」——改模板请改 schema 后跑 node scripts/gen-env-templates.mjs
      - name: Check env templates match schema
        run: node scripts/gen-env-templates.mjs --check

      - id: set-matrix
        run: |
          # 仓库为 public：arm64 使用 GitHub 官方免费原生 ARM runner
          # (ubuntu-24.04-arm)，彻底摆脱 qemu 模拟（原 x64+qemu 下单个
          # arm64 job 需 3~6 小时，原生 ARM runner 可降至 20~40 分钟）。
          #
          # glibc 基线（主机部署的 RPM/DEB 必须在**目标机最低 glibc** 上编译，
          # glibc 只向后兼容，故只需两份产物即可覆盖 2.17/2.27/2.28/2.29）：
          #   x64   → glibc 2.17（银河麒麟 V10 SP1 / CentOS 7）
          #           manylinux2014_x86_64（GCC 10 + glibc 2.17）
          #           + unofficial Node glibc-217（官方 Node 要求 glibc >= 2.28）
          #   arm64 → glibc 2.28（麒麟 V10 SP2/SP3、UOS 20）
          #           manylinux_2_28_aarch64（GCC 14 + glibc 2.28）+ Node 官方 arm64
          node_ver='${{ env.NODE_TAR_VERSION }}'
          # node_url 必须是「完整下载前缀」：unofficial-builds 与 nodejs.org 都是目录式
          # 布局（<根>/vX.Y.Z/<包名>），漏掉版本目录会一律 404。
          x64='{"arch":"x64","runner":"ubuntu-latest","baseline":"glibc217","glibc":"217","max_glibc":"2.17","base_image":"quay.io/pypa/manylinux2014_x86_64","node_url":"https://unofficial-builds.nodejs.org/download/release/'"$node_ver"'","node_tar":"node-'"$node_ver"'-linux-x64-glibc-217.tar.gz","target_image":"centos:7"}'
          arm64='{"arch":"arm64","runner":"ubuntu-24.04-arm","baseline":"glibc228","glibc":"228","max_glibc":"2.28","base_image":"quay.io/pypa/manylinux_2_28_aarch64","node_url":"https://nodejs.org/dist/'"$node_ver"'","node_tar":"node-'"$node_ver"'-linux-arm64.tar.xz","target_image":"debian:10"}'
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "matrix={\"include\":[$x64,$arm64]}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.target_arch }}" = "arm64" ]; then
              echo "matrix={\"include\":[$arm64]}" >> "$GITHUB_OUTPUT"
            else
              echo "matrix={\"include\":[$x64]}" >> "$GITHUB_OUTPUT"
            fi
          fi
      # 早失败门禁：Node 运行时下载地址必须可达。
      # 目录式布局很容易被写成"漏掉 /vX.Y.Z 目录"的扁平地址（一律 404），而它在
      # payload 阶段才暴露——那时已经拉完基线镜像、编译数分钟，代价极高（曾因此
      # 让 x64/arm64 两条腿各白跑约 10 分钟）。这里几秒内判定，并直接打印最终 URL。
      - name: Preflight Node tarball URLs
        run: |
          set -euo pipefail
          # 地址取自 set-matrix 的输出，与实际构建用的一致（单一事实来源）
          urls="$(echo '${{ steps.set-matrix.outputs.matrix }}' | jq -r '.include[] | "\(.node_url)/\(.node_tar)"')"
          fail=0
          for u in $urls; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' --head "$u" || true)"
            if [ "$code" != "200" ]; then
              # 部分 CDN 不支持 HEAD，退回范围请求探测
              code="$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$u" || true)"
            fi
            echo "  HTTP $code  $u"
            case "$code" in
              200|206) ;;
              *) echo "::error::Node 下载地址不可用（HTTP $code）：$u"; fail=1 ;;
            esac
          done
          exit "$fail"

      - id: set-params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF##*/}"
            ver="${ver#v}"
            echo "build_type=all" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "release=1" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Job 1: 源码打包（pack）— 编译全部子包，输出 dist/ 目录
  # 纯 Node.js 构建，无需原生编译，x64 和 arm64 产物相同
  # ═══════════════════════════════════════════════════════════════════
  pack:
    needs: prepare
    if: needs.prepare.outputs.build_type == 'all' || needs.prepare.outputs.build_type == 'pack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # mediasoup postinstall 需要能裸 `pip install` 的 python3。
      # ubuntu-latest(24.04) 系统 python3 无 pip 且受 PEP 668 限制，
      # 用 setup-python 提供的 python.org 解释器（自带 pip、不受限制）。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build mediasoup worker
        run: |
          # 优先下载官方预编译 worker（x64 原生 runner 也可秒级完成），
          # 失败自动回退本地编译；runner 位于境外，pip 源文件使用官方源。
          echo "→ prefer mediasoup-worker prebuilt download (fallback: local build)"
          export PIP_INDEX_URL="https://pypi.org/simple"
          GHPROXY="https://gh-proxy.com"
          if [ -d node_modules/mediasoup/worker/subprojects ]; then
            node ./serve/realtime/patch-mediasoup-wrap.cjs "$GHPROXY"
            cd node_modules/mediasoup
            node npm-scripts.mjs postinstall
          fi
          cd ${{ github.workspace }}
          npm rebuild better-sqlite3

      - name: Run pack
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-pack-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════
  # Job 2: Docker 离线包（pack:docker）— 构建 Docker 镜像并打包为 .tar
  # 需要 Docker daemon，支持 x64/arm64 交叉构建
  # ═══════════════════════════════════════════════════════════════════
  docker:
    needs: prepare
    if: needs.prepare.outputs.build_type == 'all' || needs.prepare.outputs.build_type == 'docker'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Docker offline bundle
        env:
          DOCKER_PLATFORM: ${{ matrix.arch == 'arm64' && 'linux/arm64' || '' }}
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -n "$DOCKER_PLATFORM" ]; then
            npm run pack:docker
          else
            npm run pack:docker
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-docker-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/docker/
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════
  # Job 3: Native 离线包（pack:native）— tar.gz 安装包
  # 原生模块（better-sqlite3 / mediasoup-worker）直接复用 rpm job 在对应 glibc
  # 基线容器里编译出的 payload，避免在 Ubuntu 24.04(glibc 2.39) 上编译导致
  # 目标机（麒麟 V10 SP1 = 2.17）无法加载。
  # ═══════════════════════════════════════════════════════════════════
  native:
    needs: [prepare, rpm]
    if: needs.prepare.outputs.build_type == 'all' || needs.prepare.outputs.build_type == 'native'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download baseline payload
        uses: actions/download-artifact@v4
        with:
          name: meeting-payload-${{ matrix.arch }}-${{ matrix.baseline }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/payload

      - name: Build native package (from baseline payload)
        env:
          PACK_NATIVE_FORCE: "1"
          MEETING_VERSION: ${{ needs.prepare.outputs.version }}
          PACK_NATIVE_PAYLOAD: ${{ github.workspace }}/dist/payload/meeting-payload.tar.gz
          PACK_NATIVE_BASELINE: ${{ matrix.baseline }}
        run: |
          # 不在 runner（Ubuntu 24.04 / glibc 2.39）上编译原生模块：直接复用基线容器
          # 产出的 payload，否则 better-sqlite3 / mediasoup-worker 在麒麟 V10 SP1(2.17)
          # 等目标机上无法加载。产物架构即 runner 架构，无需 qemu。
          test -f "$PACK_NATIVE_PAYLOAD" || { echo "missing payload: $PACK_NATIVE_PAYLOAD" >&2; exit 1; }
          echo "→ ${{ matrix.arch }} native bundle from payload (baseline ${{ matrix.baseline }})"
          npm run pack:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-native-${{ matrix.arch }}-${{ matrix.baseline }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/native/
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════
  # Job 4: RPM 包（pack:rpm）— 使用 Docker 模式构建，内嵌 Node.js
  # ═══════════════════════════════════════════════════════════════════
  rpm:
    needs: prepare
    # deb 依赖本 job 的 RPM 产物、native 依赖本 job 的基线 payload，
    # 因此"仅选 deb / 仅选 native"时也必须先构建 rpm。
    if: needs.prepare.outputs.build_type == 'all' || needs.prepare.outputs.build_type == 'rpm' || needs.prepare.outputs.build_type == 'deb' || needs.prepare.outputs.build_type == 'native'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build payload (glibc ${{ matrix.max_glibc }} baseline)
        run: |
          echo "→ payload: ${{ matrix.arch }} / ${{ matrix.baseline }} on ${{ matrix.runner }}"
          echo "  base image : ${{ matrix.base_image }}"
          echo "  node       : ${{ matrix.node_url }}/${{ matrix.node_tar }}"

          # 基线镜像只负责编译：工具链与目标机 glibc 一致，不含打包工具
          docker build \
            -t meeting-payload-builder \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --build-arg NODE_TAR_URL=${{ matrix.node_url }} \
            --build-arg NODE_TAR=${{ matrix.node_tar }} \
            -f deploy/rpm/Dockerfile.payload \
            .

          mkdir -p dist/payload

          # node_modules 缓存按「架构+基线」隔离，避免不同基线的原生模块互相污染。
          # 原生架构 runner 上 docker 自动使用对应架构镜像，无需 --platform/qemu。
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/dist/payload:/output" \
            -v "meeting-build-modules-${{ matrix.arch }}-${{ matrix.baseline }}:/workspace/node_modules" \
            -e TARGET_ARCH=${{ matrix.arch }} \
            -e RPM_VERSION=${{ needs.prepare.outputs.version }} \
            -e RPM_RELEASE=${{ needs.prepare.outputs.release }} \
            -e USE_SYSTEM_NODE=1 \
            -e BASELINE_GLIBC=${{ matrix.glibc }} \
            -e PAYLOAD_ONLY=1 \
            -e SKIP_WRAP_PATCH=1 \
            meeting-payload-builder \
            bash /workspace/deploy/rpm/build-rpm.sh

      - name: Build RPM (packaging only)
        run: |
          # 打包镜像（Debian bookworm + fpm/rpm/cpio）：打包与 glibc 无关，
          # 因此与基线解耦，可直接复用现有镜像。
          docker build -t meeting-rpm-builder -f deploy/rpm/Dockerfile.build .

          mkdir -p dist/rpm
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/dist/rpm:/output" \
            -v "$PWD/dist/payload:/payload:ro" \
            -e TARGET_ARCH=${{ matrix.arch }} \
            -e RPM_VERSION=${{ needs.prepare.outputs.version }} \
            -e RPM_RELEASE=${{ needs.prepare.outputs.release }} \
            -e PACKAGE_FROM=/payload/meeting-payload.tar.gz \
            meeting-rpm-builder \
            bash /workspace/deploy/rpm/build-rpm.sh

      - name: Verify glibc baseline (symbols ≤ ${{ matrix.max_glibc }})
        run: |
          # 断言 node / better-sqlite3 / mediasoup-worker 的最高 GLIBC 符号版本不超标，
          # 防止「编译环境意外漂移」导致产物在目标机上 GLIBC_x.y not found
          docker run --rm \
            -v "$PWD/dist/payload:/payload:ro" \
            -v "$PWD/deploy/rpm:/scripts:ro" \
            -e MODE=symbols \
            -e MAX_GLIBC=${{ matrix.max_glibc }} \
            meeting-rpm-builder \
            bash /scripts/verify-payload.sh /payload/meeting-payload.tar.gz

      - name: Smoke test on target baseline (${{ matrix.target_image }})
        run: |
          # 在目标基线容器里真实加载三个原生件（缺库/符号不兼容会直接失败）
          docker run --rm \
            -v "$PWD/dist/payload:/payload:ro" \
            -v "$PWD/deploy/rpm:/scripts:ro" \
            -e MODE=runtime \
            ${{ matrix.target_image }} \
            bash /scripts/verify-payload.sh /payload/meeting-payload.tar.gz

      - name: Rename RPM with architecture and baseline
        run: |
          cd dist/rpm
          arch_tag="${{ matrix.arch }}"
          if [ "$arch_tag" = "arm64" ]; then
            arch_tag="aarch64"
          else
            arch_tag="x86_64"
          fi
          for f in meeting-*.rpm; do
            [ -f "$f" ] && mv "$f" "meeting-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}.${{ matrix.baseline }}.${arch_tag}.rpm" || true
          done
          ls -lh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-rpm-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/rpm/meeting-*.rpm
          retention-days: 30
          if-no-files-found: error

      - name: Upload baseline payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-payload-${{ matrix.arch }}-${{ matrix.baseline }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/payload/meeting-payload.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════
  # Job 5: DEB 包 — 在 RPM 构建完成后，用 fpm 将 RPM 转为 DEB
  # ═══════════════════════════════════════════════════════════════════
  deb:
    needs: [prepare, rpm]
    if: needs.prepare.outputs.build_type == 'all' || needs.prepare.outputs.build_type == 'deb'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: meeting-rpm-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/rpm

      - name: Build DEB from RPM
        run: |
          echo "→ Converting RPM to DEB"
          # deb job 运行在全新 runner（独立 VM），没有 rpm job 构建的镜像，
          # 必须在此重建 meeting-rpm-builder。注意不要用 `|| true` 吞掉失败：
          # 镜像缺失会让下方 docker run 以 125 提前退出，且内部 `|| echo`
          # 兜不住，导致步骤直接变红。
          # 原生架构 runner 上直接构建，无需 --platform。
          docker build \
            -t meeting-rpm-builder \
            -f deploy/rpm/Dockerfile.build \
            .

          mkdir -p dist/deb

          # DEB 架构后缀：x64 → amd64、arm64 → arm64（Debian 命名）。
          # 若不带架构，x64/arm64 产物都叫 meeting-<ver>-<rel>.deb，
          # release 收集步骤的 mv 会相互覆盖，Releases 只剩一个包。
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            deb_arch="arm64"
          else
            deb_arch="amd64"
          fi

          docker run --rm \
            -v "$PWD/dist/rpm:/input:ro" \
            -v "$PWD/dist/deb:/output" \
            -v "$PWD/deploy/rpm:/scripts:ro" \
            --entrypoint bash \
            meeting-rpm-builder \
            -c "cd /input && \
                rpm_file=\$(ls meeting-*.rpm | head -1) && \
                echo \"Converting: \$rpm_file\" && \
                fpm -s rpm -t deb \
                  -n meeting \
                  -v ${{ needs.prepare.outputs.version }} \
                  --iteration ${{ needs.prepare.outputs.release }} \
                  --after-install /scripts/post.sh \
                  --before-remove /scripts/prerm.deb.sh \
                  -p /output/meeting-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}.${{ matrix.baseline }}.${deb_arch}.deb \
                  \$rpm_file && \
                deb_file=\$(ls /output/meeting-*.deb | head -1) && \
                mkdir -p /tmp/deb-ctrl && \
                dpkg-deb -e \"\$deb_file\" /tmp/deb-ctrl && \
                grep -q setcap /tmp/deb-ctrl/postinst && \
                echo 'DEB postinst 含 setcap 兜底（systemd 219 下 443 可绑定）' && \
                grep -q 'remove)' /tmp/deb-ctrl/prerm && \
                grep -q 'systemctl --no-block stop' /tmp/deb-ctrl/prerm && \
                ! grep -q '\[ \$1 -eq' /tmp/deb-ctrl/prerm && \
                echo 'DEB prerm 已按 Debian 动作名适配（remove 时停服务并 disable；无 RPM 式 $1 -eq 0 残留）' && \
                echo 'DEB conversion complete'"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-deb-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}
          path: dist/deb/meeting-*.deb
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════
  # 发布 Release（仅 tag 推送触发）：下载全部构建产物并上传到 GitHub Release
  #  - rpm/deb：单文件安装包，直接作为资产（rpm -ivh / dpkg -i 可直接用）
  #  - 源码/Docker：多文件交付包，整体 zip 保持目录结构完整
  #  - Native：单层目录 zip（顶层目录与 zip 同名，剔除冗余 .tar.gz，避免双重嵌套）
  #  - 任一构建 job 失败则跳过发布（避免半成品 Release）
  # ═══════════════════════════════════════════════════════════════════
  release:
    needs: [prepare, pack, docker, native, rpm, deb]
    runs-on: ubuntu-latest
    # 只有全部构建 job 都成功才发布。注意不能只排除 failure：
    # 曾出现"构建被并发组取消（cancelled）却仍然创建了 Release"——cancelled/skipped
    # 都不等于 failure，旧条件因此放行，发布出只含 pack/docker 的半成品 Release。
    if: >-
      always()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && !contains(needs.*.result, 'skipped')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release assets
        run: |
          set -eu
          mkdir -p release-files
          cd release-assets
          ls -la
          for d in */; do
            name="${d%/}"
            case "$name" in
              meeting-rpm-*|meeting-deb-*)
                # 单文件安装包：直接作为 Release 资产
                find "$d" -type f \( -name '*.rpm' -o -name '*.deb' \) \
                  -exec mv {} ../release-files/ \;
                ;;
              meeting-payload-*)
                # CI 内部中间产物（native/deb 构建的输入）：只在 Actions 产物里留存，
                # 不对外发布，避免把中间件混进 Release 资产列表
                echo "→ 跳过内部产物（不发布）：$name"
                ;;
              meeting-native-*)
                # Native 离线包：只打包内层真实 bundle（含 install.sh/app/bin/...），
                # 顶层目录重命名为与 zip 同名（meeting-native-<arch>-<baseline>-<ver>-<rel>），
                # 不再内嵌冗余 .tar.gz，避免双重嵌套。install.sh 依赖的兄弟文件布局保持不变。
                inner=$(ls -d "$name"/meeting-native-* 2>/dev/null | head -1)
                if [ -n "$inner" ]; then
                  staged="release-files-staging/${name}"
                  rm -rf "$staged"; mkdir -p "$staged"
                  cp -r "$inner/." "$staged/"
                  [ -f "$name/README.txt" ] && cp "$name/README.txt" "$staged/"
                  ( cd release-files-staging && zip -r -q "../release-files/${name}.zip" "$name" )
                  rm -rf "$staged"
                else
                  zip -r -q "../release-files/${name}.zip" "$name"
                fi
                ;;
              *)
                # 多文件交付包（源码/Docker）：整体 zip
                zip -r -q "../release-files/${name}.zip" "$name"
                ;;
            esac
          done
          cd ..
          echo "→ Release 资产："
          ls -lh release-files/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # 逐个顺序上传资产：gh 的 create/upload 默认并发上传，多资产（尤其 native 包现已内嵌
          # Node 运行时，体积较大）时 GitHub 资产接口会偶发返回 HTTP 400；顺序上传可规避并发，
          # 并对单个资产失败做重试。Release 已存在时 release upload --clobber 可补齐缺失资产。
          upload_one() {
            local f="$1"
            for i in 1 2 3; do
              echo "→ 上传资产（尝试 $i/3）：$(basename "$f")"
              if gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "$f"; then
                return 0
              fi
              sleep 3
            done
            echo "::error::资产上传失败：$f"
            return 1
          }
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "→ Release 已存在，补充上传缺失资产（覆盖同名）"
          else
            echo "→ 创建 Release $tag（资产随后逐个上传）"
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Meeting $tag" \
              --generate-notes
          fi
          shopt -s nullglob
          n=0
          for f in release-files/*; do
            upload_one "$f" || exit 1
            n=$((n + 1))
          done
          echo "→ 共上传 $n 个资产"

      - name: Summary
        run: |
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "全部产物已上传到 [GitHub Release ${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # 构建完成汇总
  # ═══════════════════════════════════════════════════════════════════
  summary:
    needs: [prepare, pack, docker, native, rpm, deb, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 源码打包 (pack) | ${{ needs.pack.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker 离线包 | ${{ needs.docker.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native 离线包 | ${{ needs.native.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RPM 包 | ${{ needs.rpm.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DEB 包 | ${{ needs.deb.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release 上传 | ${{ needs.release.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts 可在 Actions 运行页下载；tag 构建产物同时发布在 Releases 页。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.release }}" >> $GITHUB_STEP_SUMMARY
