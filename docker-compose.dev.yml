# 本地开发 override：在 Windows 宿主机上跑 UI，媒体面用 Linux 容器
#
# 背景：mediasoup-worker 在 Windows 上无法运行（0xC0000005 崩溃，与代码无关），
# 本机联调音视频时让 api/realtime 跑 Linux 容器，浏览器仍从 Windows 访问。
#
# 用法（在仓库根目录）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 与 docker-compose.yml 的差异：
#   1. api    发布 8080（默认仅 expose，供 Windows 上的 vite dev 代理 /api）
#   2. web    发布 8088（绕过 caddy 443/证书，浏览器直接 http://localhost:8088）
#   3. realtime 发布 8082（基础文件仅 expose，供 vite dev 代理 /ws；UDP 段基础文件已发布）
#
# 注意：
#   - api/realtime 必须一起容器化（共用 meeting-data 卷）：若 api 跑宿主机（MySQL）、
#     realtime 跑容器（sqlite），两边数据不一致，容器侧看不到宿主机创建的会议
#   - 本机 vite（8081）与容器 api(8080)/realtime(8082) 可共存，无端口冲突
#   - MEDIASOUP_ANNOUNCED_IP 本机自测保持 127.0.0.1 即可；
#     局域网其他设备访问时改为宿主机局域网 IP 后 `up -d` 重建 realtime
#   - sqlite 默认 profile：数据在 meeting-data 卷，`down -v` 会清库
services:
  api:
    build:
      args:
        # 本地开发构建走国内 npm 镜像（CI 用基础文件的 build，不受影响）
        NPM_REGISTRY: https://registry.npmmirror.com
    environment:
      # dev 兜底：优雅停机异常时 8s 强退（生产默认 30s，保障录制上传等在途请求）
      SHUTDOWN_TIMEOUT_MS: 8000
    ports:
      - "8080:8080"

  realtime:
    build:
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        # pip（mediasoup venv）走国内源：默认 pypi.org 在国内常读超时（CI 默认值不变）
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    ports:
      - "8082:8082"
      # Docker Desktop 29.x 升级后宿主机→容器 UDP 转发失效（TCP 正常），
      # 本地联调额外发布 TCP 媒体段：浏览器 ICE 会在 UDP 不通时自动回落到
      # TCP 候选（mediasoup enableTcp 已开启）。UDP 恢复后可移除。
      # 端口段跟随 .env 的 RTC_MIN_PORT/RTC_MAX_PORT（此前硬编码 1000 个，
      # 是 Docker Desktop 上 realtime 容器启停分钟级缓慢的主因）
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-41000}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-41000}/tcp"

  web:
    build:
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    ports:
      - "8088:80"
