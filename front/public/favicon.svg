<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Meeting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46C6EE"/>
      <stop offset="1" stop-color="#3F84D2"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底：取 option1 蓝色纵向渐变 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 白色对话气泡描边（圆角矩形） -->
  <rect x="120" y="140" width="272" height="196" rx="56" ry="56"
        fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 气泡左下尾巴 -->
  <path d="M190 340 L190 414 L272 340 Z" fill="#FFFFFF"/>
</svg>
