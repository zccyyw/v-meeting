server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 日志落盘到挂载目录（compose 挂载 ./logs/web:/var/log/nginx），
  # 覆盖官方镜像默认的 /dev/stdout 软链；轮转由宿主机 logrotate copytruncate 处理
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # 信令 WebSocket：生产流量由 caddy 先行代理（Caddyfile /ws），本条仅在
  # 直连 web 容器访问（如本地 docker compose dev 验证）时生效，冗余无害
  location /ws {
    proxy_pass http://realtime:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # 运行时配置注入文件：容器每次启动可能被重写，禁止缓存，避免改配置后浏览器仍旧值
  location = /app-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
