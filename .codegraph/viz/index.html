<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeGraph 可视化</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --panel: rgba(22, 28, 36, 0.92);
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: 100%;
      }
      @media (max-width: 960px) {
        #layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 50vh;
        }
      }
      #sidebar {
        border-right: 1px solid var(--border);
        padding: 16px;
        overflow: auto;
        background: var(--panel);
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 12px;
        font-weight: 600;
      }
      #meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
        line-height: 1.5;
      }
      #stats {
        font-size: 13px;
      }
      #stats dl {
        margin: 0;
      }
      #stats dt {
        color: var(--muted);
        margin-top: 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #stats dd {
        margin: 4px 0 0;
      }
      #kindbars {
        margin-top: 12px;
      }
      .kindrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 12px;
      }
      .kindrow span.name {
        width: 88px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .kindrow .barwrap {
        flex: 1;
        height: 8px;
        background: #21262d;
        border-radius: 4px;
        overflow: hidden;
      }
      .kindrow .bar {
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
      }
      #graph {
        position: relative;
        min-height: 320px;
      }
      #err {
        padding: 16px;
        color: #f85149;
        max-width: 640px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <h1>CodeGraph</h1>
        <div id="meta">加载中…</div>
        <section id="stats"></section>
      </aside>
      <main id="graph"></main>
    </div>
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="module">
      const metaEl = document.getElementById("meta");
      const statsEl = document.getElementById("stats");
      const graphEl = document.getElementById("graph");

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fail(msg) {
        graphEl.innerHTML = `<div id="err">${msg}</div>`;
      }

      async function loadJson(url) {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`${url} → ${res.status}`);
        return res.json();
      }

      function renderKinds(nodesByKind) {
        const entries = Object.entries(nodesByKind || {}).sort((a, b) => b[1] - a[1]);
        const max = Math.max(1, ...entries.map(([, n]) => n));
        const rows = entries
          .map(
            ([k, n]) => `
          <div class="kindrow">
            <span class="name">${escapeHtml(k)}</span>
            <div class="barwrap"><div class="bar" style="width:${(n / max) * 100}%"></div></div>
            <span>${n}</span>
          </div>`,
          )
          .join("");
        return `<div id="kindbars">${rows}</div>`;
      }

      function groupColor(group) {
        const palette = {
          front: "#3fb950",
          api: "#58a6ff",
          realtime: "#d2a8ff",
          shared: "#f0883e",
          db: "#79c0ff",
          other: "#8b949e",
        };
        return palette[group] || palette.other;
      }

      try {
        const [status, graph] = await Promise.all([loadJson("./data/status.json"), loadJson("./data/graph.json")]);

        metaEl.innerHTML = `
          项目：<code>${escapeHtml(status.projectPath || "")}</code><br />
          索引：文件 ${status.fileCount} · 节点 ${status.nodeCount} · 边 ${status.edgeCount}<br />
          DB：${(status.dbSizeBytes / (1024 * 1024)).toFixed(2)} MB · ${escapeHtml((status.languages || []).join(", "))}
        `;

        const pend = status.pendingChanges || {};
        statsEl.innerHTML = `
          <dl>
            <dt>图谱（模块级）</dt>
            <dd>节点 ${graph.summary.nodeCount} · 边 ${graph.summary.edgeCount}</dd>
            <dd>导入解析：${graph.summary.resolvedFileEdges} / ${graph.summary.importRows}（未解析 ${graph.summary.skippedUnresolved}）</dd>
            <dt>与 CLI 对齐（codegraph status -j）</dt>
            <dd>pending：+${pend.added ?? 0} ~${pend.modified ?? 0} −${pend.removed ?? 0}</dd>
          </dl>
          ${renderKinds(status.nodesByKind)}
        `;

        const nodes = new vis.DataSet(
          graph.nodes.map((n) => ({
            id: n.id,
            label: n.label || n.id,
            color: groupColor(n.group),
            font: { color: "#e6edf3", size: 13 },
            margin: 10,
          })),
        );

        const edges = new vis.DataSet(
          graph.edges.map((e, i) => ({
            id: `e${i}`,
            from: e.source,
            to: e.target,
            value: Math.max(1, Math.min(12, Math.log2(1 + e.weight) * 2)),
            title: `×${e.weight}`,
            arrows: "to",
            color: { color: "#484f58", highlight: "#58a6ff" },
          })),
        );

        const data = { nodes, edges };
        const options = {
          physics: {
            enabled: true,
            stabilization: { iterations: 120 },
            barnesHut: {
              gravitationalConstant: -12000,
              springConstant: 0.06,
              damping: 0.5,
            },
          },
          interaction: { hover: true, multiselect: false, navigationButtons: true },
        };

        // eslint-disable-next-line no-undef
        new vis.Network(graphEl, data, options);
      } catch (e) {
        console.error(e);
        metaEl.textContent = "";
        statsEl.innerHTML = "";
        fail(
          `<p>无法加载 <code>data/status.json</code> 或 <code>data/graph.json</code>。</p>
          <p>请在仓库根目录执行：<code>npm run codegraph:viz</code>（或 <code>node .codegraph/scripts/export-viz.mjs</code>），然后用本地静态服务器打开本目录（例如 <code>npx serve .codegraph/viz</code>），不要直接用 file:// 打开。</p>
          <p><small>${escapeHtml(e.message)}</small></p>`,
        );
      }
    </script>
  </body>
</html>
