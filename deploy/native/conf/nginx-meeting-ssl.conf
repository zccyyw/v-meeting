# HTTPS edge for native offline install (replace meeting-gateway or front it).
# 1) sudo systemctl disable --now meeting-gateway
# 2) Put certs in /opt/meeting/certs/{fullchain.pem,privkey.pem}
# 3) Copy this file to /etc/nginx/conf.d/meeting-ssl.conf (edit server_name)
# 4) sudo nginx -t && sudo systemctl reload nginx
#
# Front must use relative /api and auto /ws (pack:native default).

server {
    listen 80;
    server_name meeting.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meeting.example.com;

    ssl_certificate     /opt/meeting/certs/fullchain.pem;
    ssl_certificate_key /opt/meeting/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/meeting/app/front;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
